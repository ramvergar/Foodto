{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodto - Iniciar Sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/variables.css' %}">
    <link rel="stylesheet" href="{% static 'css/global.css' %}">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">

</head>
<body class="auth-page">

<div class="auth-container">

    <h1 class="auth-logo">FOODTO.</h1>
    <p class="auth-subtitle">Sistema de Análisis Visual de Alérgenos</p>

    <div class="auth-card">

        <h2>Iniciar sesión</h2>

        <p class="auth-description">
            Accede a tu cuenta para comenzar a analizar alimentos mediante inteligencia artificial.
        </p>

        <form method="post">

            {% csrf_token %}
            {{ form.as_p }}

            <button class="btn btn-primary" type="submit">
                Iniciar sesión
            </button>

        </form>

        <div class="auth-links">

            <p>
                ¿No tienes una cuenta?
                <a href="{% url 'registro' %}">Regístrate</a>
            </p>

            <a class="back-home" href="{% url 'landing' %}">
                ← Volver al inicio
            </a>

        </div>

    </div>

</div>

</body>
</html>
