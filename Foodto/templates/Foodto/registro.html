<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodto - Iniciar Sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --rojo-principal: #D32F2F;
            --fondo-crema: #F7F5F0;
            --texto-oscuro: #1A1A1A;
            --borde-fino: 2px solid var(--texto-oscuro);
            --sombra-solida: 4px 4px 0px var(--texto-oscuro);
        }

        body { 
            background-color: var(--fondo-crema); 
            font-family: 'Outfit', sans-serif; 
            text-align: center; 
            color: var(--texto-oscuro); 
            margin: 0;
            padding: 20px 10px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        h1.logo { 
            font-family: 'Oswald', sans-serif;
            color: var(--rojo-principal); 
            font-size: 3.5rem; 
            font-weight: 900; 
            margin-bottom: 5px; 
            letter-spacing: 2px; 
        }

        .subtitulo {
            font-size: 0.85rem;
            letter-spacing: 1px;
            color: #666;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .card { 
            background: white; 
            border: var(--borde-fino); 
            border-radius: 6px; 
            padding: 30px 20px; 
            width: 100%;
            max-width: 400px; 
            box-sizing: border-box;
            box-shadow: var(--sombra-solida); 
            text-align: left; 
        }

        h2 {
            font-family: 'Oswald', sans-serif;
            margin-top: 0; 
            border-bottom: var(--borde-fino); 
            padding-bottom: 10px;
            margin-bottom: 20px;
            font-size: 1.6rem;
            letter-spacing: 0.5px;
        }

        /* Hack para estirar y poner bonitos los inputs que genera Django automáticamente */
        .card p {
            margin-bottom: 15px;
        }
        .card label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 0.95rem;
        }
        .card input { 
            width: 100%; 
            padding: 12px; 
            border: var(--borde-fino); 
            border-radius: 4px; 
            box-sizing: border-box; 
            font-size: 1rem; 
            font-family: 'Outfit', sans-serif;
        }
        .card input:focus {
            outline: none;
            border-color: var(--rojo-principal);
        }

        .btn-submit { 
            width: 100%; 
            padding: 15px; 
            background-color: var(--rojo-principal); 
            color: white; 
            font-family: 'Oswald', sans-serif;
            font-weight: bold; 
            font-size: 1.2rem; 
            border: var(--borde-fino); 
            border-radius: 4px; 
            cursor: pointer; 
            text-transform: uppercase; 
            margin-top: 15px; 
            letter-spacing: 1px;
            transition: transform 0.1s;
        }
        .btn-submit:hover, .btn-submit:active { 
            background-color: #b71c1c; 
            transform: translateY(2px);
        }

        .volver { 
            display: block; 
            text-align: center; 
            margin-top: 20px; 
            color: var(--texto-oscuro); 
            text-decoration: none; 
            font-weight: bold; 
            font-size: 0.95rem;
        }
        .volver:hover {
            color: var(--rojo-principal);
        }
    </style>
</head>
<body>

    <h1 class="logo">FOODTO.</h1>
    <p class="subtitulo">Sistema de Análisis Visual de Alérgenos</p>

    <div class="card">
        <h2>INICIAR SESIÓN</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-submit">Entrar al Escáner</button>
        </form>
        <a href="{% url 'inicio' %}" class="volver">← Volver al inicio</a>
    </div>

</body>
</html>
