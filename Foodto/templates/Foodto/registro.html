{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodto - Iniciar sesión</title>

    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/variables.css' %}">
    <link rel="stylesheet" href="{% static 'css/global.css' %}">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>

<body class="auth-page">

    <div class="auth-container">

        <h1 class="auth-logo">FOODTO.</h1>
        <p class="auth-subtitle">Sistema de Análisis Visual de Alérgenos</p>

        <div class="auth-card">

            <h2>Crea tu cuenta</h2>

            <p class="auth-description">
                Crea tu cuenta para comenzar a analizar alimentos mediante inteligencia artificial.
            </p>

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}

                <button type="submit" class="btn btn-primary">
                    Entrar a Foodto
                </button>
            </form>

            <div class="auth-links">

                <p>
                    ¿Ya tienes una cuenta?
                    <a href="{% url 'login' %}">Iniciar sesión</a>
                </p>

                <a href="{% url 'landing' %}" class="back-home">
                    ← Volver al inicio
                </a>

            </div>

        </div>

    </div>

</body>
</html>
