{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodto - Acceso</title>

    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/variables.css' %}">
    <link rel="stylesheet" href="{% static 'css/global.css' %}">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>

<body class="auth-page">

    <div class="auth-container">

        <h1 class="auth-logo">FOODTO.</h1>

        <p class="auth-subtitle">
            Sistema de Análisis Visual de Alérgenos
        </p>

        <div class="auth-card">

            <h2>Módulo de acceso</h2>

            <p class="auth-description">
                Identifícate para acceder al escáner inteligente y analizar alimentos mediante inteligencia artificial.
            </p>

            <a href="{% url 'login' %}" class="btn btn-secondary">
                Iniciar sesión
            </a>

            <br>

            <a href="{% url 'registro' %}" class="btn btn-primary">
                Crear cuenta
            </a>

        </div>

    </div>

</body>
</html>
